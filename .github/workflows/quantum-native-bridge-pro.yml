name: Quantum Native Bridge Pro CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            extras: 'test'
          - python-version: '3.12'
            extras: 'test'
          - python-version: '3.12'
            extras: 'test,qiskit'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the calculator package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Calculator smoke test through the installed command
        run: |
          nrqc check native_relational_qc/calculator_examples/bell.json > /dev/null
          nrqc calculate native_relational_qc/calculator_examples/bell.json > /dev/null

      - name: Run unit tests
        run: python -m pytest -q

      - name: Regenerate demo ledger under the current schema
        run: python tools/regenerate_demo_ledger.py --out QUANTUM_NATIVE_BRIDGE_PRO_EVIDENCE/demo-bridge-ledger-current.jsonl

      - name: Verify evidence bridge ledger
        run: |
          python -m quantum_native_bridge_pro.cli verify \
            --ledger QUANTUM_NATIVE_BRIDGE_PRO_EVIDENCE/demo-bridge-ledger-current.jsonl

      - name: Export evidence certificate
        run: |
          python -m quantum_native_bridge_pro.cli certificate \
            --ledger QUANTUM_NATIVE_BRIDGE_PRO_EVIDENCE/demo-bridge-ledger-current.jsonl \
            --out rebuilt-quantum-bridge-certificate.json
